<body class="workspace-body"><header class="workspace-header"><a class="wordmark" href="index.html">morrow<span>.</span></a><div><span class="workspace-label">Maker workspace</span><a class="workspace-store-link" href="shop.html">View store ↗</a></div></header><main class="workspace seller-workspace" id="main-content"><section class="workspace-intro"><div><p class="eyebrow">Sell with Morrow</p><h1>Make something worth keeping.</h1><p>Share the object, the material, and the story behind your work. Submissions are reviewed before they join the collection.</p></div></section><section class="workspace-panel"><div class="panel-heading"><div><p class="eyebrow">New submission</p><h2>Tell us about your piece.</h2></div></div><form class="seller-form" id="seller-form"><div class="form-grid"><div><label for="seller-name">Your name</label><input id="seller-name" required /></div><div><label for="seller-email">Email</label><input id="seller-email" type="email" required /></div><div><label for="seller-product">Product name</label><input id="seller-product" required /></div><div><label for="seller-category">Category</label><select id="seller-category"><option value="ceramics">Ceramics</option><option value="textiles">Textiles</option><option value="lighting">Lighting</option></select></div><div><label for="seller-price">Suggested price</label><input id="seller-price" type="number" min="0" step="1" required /></div><div><label for="seller-image">Product image URL</label><input id="seller-image" type="url" required /></div></div><label for="seller-description">Description</label><textarea id="seller-description" rows="5" required></textarea><label for="seller-material">Materials and process</label><textarea id="seller-material" rows="4" required></textarea><button class="primary-button" type="submit">Send for review <span>↗</span></button><p class="form-message" id="seller-message" role="status"></p></form></section></main><script src="user-store.js"></script><script src="api-client.js"></script><script src="seller.js"></script><script src="auth-gate.js"></script></body></html>
